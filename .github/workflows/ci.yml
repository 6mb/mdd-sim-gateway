name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: control/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y swig libpcsclite-dev
      - run: pip install -r control/requirements.txt
      - run: python -m py_compile control/app/*.py engine/*.py host/*.py
      - run: python -m unittest discover -s tests -v
      - run: sh -n install.sh engine/entrypoint.sh

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No real subscriber identifiers in the tree
        # RELEASE_CHECKLIST.md has always required this scan, but as a manual step it was
        # skipped for fifteen consecutive releases. Enforced here so it cannot be.
        # Invoked through sh: tools/ scripts are tracked without the executable bit,
        # matching the other scripts in that directory.
        run: sh tools/check-subscriber-identifiers.sh

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  control-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build control image
        run: docker build -f control/Dockerfile -t mdd-sim-gateway/control:ci .

  engine-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate VoWiFi engine Dockerfile
        # The release target is ARM64. Its clean image build is an explicit release-checklist
        # gate; hosted x86 runners only validate the definition and cannot reliably reach the
        # pinned sysmocom source host.
        run: docker build --check -f engine/Dockerfile engine
